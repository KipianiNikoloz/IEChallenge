[project]
name = "agidashboard-backend"
version = "0.1.0"
description = "FastAPI backend for the Black Box Democracy dashboard (modular monolith)."
authors = [{ name = "BB Democracy", email = "dev@bbd.local" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "httpx>=0.25,<1",
    "ruff>=0.4",
    "black>=24.3",
    "isort>=5.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I"]

[tool.ruff.per-file-ignores]
"app/__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
